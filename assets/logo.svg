<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="RPL3L Initiative logo: a heart formed by ribosomal subunits">
  <defs>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FD9BED"/>
      <stop offset="1" stop-color="#FF9400"/>
    </linearGradient>
  </defs>
  <!-- heart: the two lobes evoke the large and small ribosomal subunits -->
  <path d="M20 31.5 C 11.5 25.5, 7 20, 7 15 C 7 10.5, 10.3 7.5, 13.8 7.5 C 16.6 7.5, 18.9 9.2, 20 11.8 C 21.1 9.2, 23.4 7.5, 26.2 7.5 C 29.7 7.5, 33 10.5, 33 15 C 33 20, 28.5 25.5, 20 31.5 Z" fill="url(#heartGrad)"/>
  <!-- large (60S) subunit -->
  <ellipse cx="20" cy="22.5" rx="6.6" ry="4.4" fill="#0279EE"/>
  <!-- small (40S) subunit -->
  <ellipse cx="20" cy="15.6" rx="4.1" ry="2.7" fill="#FAF9F3"/>
  <!-- mRNA strand threading between subunits -->
  <path d="M14.5 19 L17.5 19 L19 17.2 L21 20.8 L22.5 19 L25.5 19" fill="none" stroke="#E9ED4C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
